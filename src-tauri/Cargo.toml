[package]
name = "movie-subtitles"
version = "0.1.12"
description = "Movie player with downloadable videos and adjustable subtitles"
authors = ["savenok"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "movie_subtitles_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "fs", "macros", "net", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
async-trait = "0.1"
thiserror = "2"
url = "2"
regex = "1"
encoding_rs = "0.8"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
tauri-plugin-notification = "2"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
